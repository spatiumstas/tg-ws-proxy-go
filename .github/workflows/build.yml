name: Build tg-ws-proxy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version'
        required: true
        type: string
      revision:
        description: 'Package revision'
        required: true
        default: '1'
        type: string

concurrency:
  group: build-${{ inputs.version }}-${{ inputs.revision }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.collect.outputs.configs }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate version and target tag
        id: release
        uses: actions/github-script@v8
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_REVISION: ${{ inputs.revision }}
        with:
          script: |
            const version = process.env.PACKAGE_VERSION;
            const revision = process.env.PACKAGE_REVISION;
            const tagCommit = async (tag) => {
              const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              let object = ref.object;
              for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
                ({ data: { object } } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha }));
              }
              if (object.type !== 'commit') throw new Error(`Tag ${tag} does not resolve to a commit`);
              return object.sha;
            };
            if (!/^[0-9]+\.[0-9]+(?:\.[0-9]+)?$/.test(version) || !/^[1-9][0-9]*$/.test(revision)) {
              throw new Error('Use version X.Y or X.Y.Z and a positive integer revision');
            }
            const tag = version;
            try {
              if (await tagCommit(tag) !== context.sha) {
                throw new Error(`Tag ${tag} points to another commit; select that tag or use a new version/revision`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('version', version);
            core.setOutput('revision', revision);
            core.setOutput('tag', tag);

      - name: Build config matrix
        id: collect
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          configs = sorted(Path("config").glob("*/*.config"))

          if not configs:
              raise SystemExit("No build configs found")

          matrix = []
          for config in configs:
              matrix.append({
                  "config": config.as_posix(),
                  "name": config.stem,
              })

          print(f"configs={json.dumps(matrix, separators=(',', ':'))}")
          PY

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - name: Run tests
        working-directory: src
        run: |
          go test -race ./...
          GOARCH=386 CGO_ENABLED=0 go test ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  build:
    name: Build packages (${{ matrix.name }})
    needs: [ prepare, test ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix fakeroot upx meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev

      - name: Build apk-tools
        if: ${{ startsWith(matrix.config, 'config/openwrt/') }}
        run: |
          git clone --depth 1 --branch v3.0.7 https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools
          cd /tmp/apk-tools
          meson setup build -Dpython=disabled -Dtests=disabled -Ddocs=disabled
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Build and package
        env:
          OPENWRT_APK_SECRET_KEY: ${{ secrets.OPENWRT_APK_SECRET_KEY }}
          PKG_VERSION: ${{ needs.prepare.outputs.version }}
          PKG_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          cp "${{ matrix.config }}" .config

          if [[ "${{ matrix.config }}" == config/openwrt/* ]]; then
            if [ -z "$OPENWRT_APK_SECRET_KEY" ]; then
              echo "OpenWrt APK signing key is required: OPENWRT_APK_SECRET_KEY" >&2
              exit 1
            fi

            KEY_FILE="$RUNNER_TEMP/openwrt-apk-private.pem"
            printf '%s' "$OPENWRT_APK_SECRET_KEY" > "$KEY_FILE"
            export BUILD_KEY_APK_SEC="$KEY_FILE"
          fi

          make package PKG_VERSION="$PKG_VERSION" PKG_REVISION="$PKG_REVISION"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.name }}
          path: |
            .build/tg-ws-proxy_*.ipk
            .build/tg-ws-proxy_*.apk
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  publish-release:
    runs-on: ubuntu-latest
    needs: [ prepare, build ]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Prepare APK public key asset
        env:
          OPENWRT_APK_PUBLIC_KEY: ${{ secrets.OPENWRT_APK_PUBLIC_KEY }}
        run: |
          if [ -n "$OPENWRT_APK_PUBLIC_KEY" ]; then
            printf '%s' "$OPENWRT_APK_PUBLIC_KEY" > out/tg-ws-proxy.pem
          fi

      - name: Ensure release matches the build commit
        id: release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const tagCommit = async (tag) => {
              const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              let object = ref.object;
              for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
                ({ data: { object } } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha }));
              }
              if (object.type !== 'commit') throw new Error(`Tag ${tag} does not resolve to a commit`);
              return object.sha;
            };
            try {
              if (await tagCommit(tag) !== context.sha) throw new Error(`Tag ${tag} moved to another commit`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha: context.sha });
            }
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({ ...context.repo, tag_name: tag, name: tag, draft: true }));
            }
            core.setOutput('id', release.id);
            core.setOutput('draft', release.draft);

      - name: Upload package assets to the selected release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -t files < <(find out -type f \( -name 'tg-ws-proxy_*.ipk' -o -name 'tg-ws-proxy_*.apk' -o -name '*.pem' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No package files found"
            exit 1
          fi

          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"

      - name: Publish the completed release
        if: ${{ steps.release.outputs.draft == 'true' }}
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });


      - name: Dispatch to feedly
        if: success()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.AGGREGATOR_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/spatiumstas/feedly/dispatches \
            -d '{"event_type":"package-built","client_payload":{"package":"'"${{ github.repository }}"'","channel":"release","tag":"'"${{ steps.target-release.outputs.tag }}"'"}}'